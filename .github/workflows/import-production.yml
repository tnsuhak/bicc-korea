name: Import approved BICC production site

on:
  push:
    paths:
      - '.github/workflows/import-production.yml'

permissions:
  contents: write

jobs:
  import-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BICC production repository
        uses: actions/checkout@v4

      - name: Download approved generated site from Deploy Preview
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://deploy-preview-2--tnsportal.netlify.app'

          pages=(
            index.html
            admissions.html
            academics.html
            fees.html
            results.html
            stories.html
            story.html
            campus-toronto.html
            story-2026-kim-yejun.html
            story-2026-park-seoyeon.html
            story-2026-geon-lee.html
          )
          for f in "${pages[@]}"; do
            curl --fail --silent --show-error --location "$BASE/$f" -o "$f"
          done

          mkdir -p assets
          assets=(
            campus-doors.webp
            campus-hall.webp
            campus-reception.webp
          )
          for f in "${assets[@]}"; do
            curl --fail --silent --show-error --location "$BASE/assets/$f" -o "assets/$f"
          done

          for f in favicon.svg robots.txt sitemap.xml; do
            curl --fail --silent --show-error --location "$BASE/$f" -o "$f"
          done

      - name: Convert preview output to clean production source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          production = 'https://bicc-korea.netlify.app'
          preview = 'https://deploy-preview-2--tnsportal.netlify.app'

          for p in Path('.').glob('*.html'):
              s = p.read_text(encoding='utf-8')
              s = s.replace(preview, production)
              s = s.replace('https://tnsportal.netlify.app', production)
              s = s.replace('BICC 디자인 프리뷰 · Production 아님', '')
              s = re.sub(r'<[^>]*>\s*BICC 디자인 프리뷰\s*·\s*Production 아님\s*</[^>]*>', '', s)
              s = re.sub(r'<meta[^>]+name=["\']robots["\'][^>]*>', '', s, flags=re.I)
              p.write_text(s, encoding='utf-8')

          Path('netlify.toml').write_text('[build]\n  publish = "."\n', encoding='utf-8')
          Path('README.md').write_text(
              '# BICC Korea\n\n'
              'Production source for the Korean-language BICC information site managed by TNS Worldwide.\n\n'
              '- Production target: https://bicc-korea.netlify.app/\n'
              '- Static site; Netlify publish directory: repository root (`.`)\n',
              encoding='utf-8'
          )
          PY

      - name: Validate production essentials
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s admissions.html
          test -s academics.html
          test -s fees.html
          test -s results.html
          test -s stories.html
          test -s robots.txt
          test -s sitemap.xml
          grep -q 'https://bicc-korea.netlify.app/' index.html
          grep -q 'Sitemap: https://bicc-korea.netlify.app/sitemap.xml' robots.txt
          ! grep -Rqi 'Production 아님' ./*.html

      - name: Commit clean production source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TNS Site Automation'
          git config user.email 'tnsuhak@gmail.com'
          git add README.md netlify.toml favicon.svg robots.txt sitemap.xml ./*.html assets/
          if git diff --cached --quiet; then
            echo 'No production changes to commit.'
            exit 0
          fi
          git commit -m 'Import approved BICC Korea production site'
          git push
